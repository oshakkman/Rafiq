<style>

<div class="wrap">
  <header><h1><svg viewBox="0 0 24 24" width="22" height="22" style="vertical-align:-5px;margin-right:8px" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--bar)" stroke-width="3.2"/><path d="M12 3a9 9 0 1 1-9 9" fill="none" stroke="var(--acc)" stroke-width="3.2" stroke-linecap="round"/><circle cx="12" cy="12" r="2.6" fill="var(--acc)"/></svg>RAFIQ</h1><span class="pill" id="st">Loading…</span><button class="ib" onclick="A.data()" aria-label="Settings and backup">⚙</button></header>
  <main id="app"></main>
</div>
<button class="fab" id="fab" onclick="A.addTxn()" aria-label="Add transaction">+</button>

<script>window.RAFIQ_STANDALONE=true;</script>
<script>
"use strict";
const OFF=!!window.RAFIQ_OFFLINE, SA=!!window.RAFIQ_STANDALONE;
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=s=>JSON.stringify(String(s)).replace(/"/g,'&quot;');
const money=n=>Number(n||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>Math.round(Number(n||0)).toLocaleString('en');
const r3=n=>Math.round(n*1000)/1000;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:NaN};
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const mk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1);
const shiftM=(k,n)=>{const[y,m]=k.split('-').map(Number);return mk(new Date(y,m-1+n,1))};
const daysIn=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const monthLabel=k=>{if(!k)return '—';const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en',{month:'long',year:'numeric'})};
const shortM=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en',{month:'short'})};
const when=ts=>{const d=new Date(ts);return d.toLocaleDateString('en',{day:'numeric',month:'short'})+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const midnight=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const floor10=n=>Math.max(0,Math.floor(n/10)*10);
const dLabel=d=>d.toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'});
const PAL=['#0f6a54','#d9774a','#4a7fb5','#c9a24a','#8a6fb0','#5fa88a','#b5566a','#9aa39e'];

const EXP_CATS=['Food & groceries','Transport','Bills & subscriptions','Health & fitness','Personal care','Shopping','Entertainment','Family & gifts','Business','Other'];
const INC_CATS=['Salary','Business income','Other income'];
const TYPES={expense:'Expense',income:'Income',debt:'Debt payment',saving:'Saving'};

const blank=()=>({v:3,cash:null,txns:[],budgets:{},budgetsU:0,debts:[],goals:[],rules:[],actions:[],strategy:{method:'auto',buffer:null,u:0},reviews:{},checkins:{},lastIncoming:0,deleted:[],chat:[],seeded:false,setupDone:false,updated:0});
let S=blank(), tab='home', planTab='budget', month=mk(new Date()), actFilter='all', undoSnap=null, sampleFn, mcpRef, foundBackup=null, slideVal=null, pendingImport=null, lastPB=[];
window.RAFIQ_EXPORT=()=>JSON.stringify(S);

/* ---------- seed: details the user told Claude earlier (confirmed in Setup) ---------- */
function seed(){
  if(SA){S.seeded=true;return;}
  const cur=mk(new Date()), now=Date.now(), td=todayStr();
  S.debts.push({id:'d_loan',name:'Personal loan',base:1350,baseAt:now,original:null,rate:0,minPay:150,dueDay:null,est:true,u:0});
  S.debts.push({id:'d_card',name:'Credit card (restructured)',base:6000,baseAt:now,original:null,rate:0,minPay:140,dueDay:null,est:true,u:0});
  S.rules.push({id:'r_salary',type:'income',name:'Salary (net)',amount:860,day:null,start:cur,end:null,from:td,category:'Salary',active:true,done:[],u:0});
  S.rules.push({id:'r_loan',type:'debt',name:'Personal loan payment',amount:150,day:null,start:cur,end:'2027-07',from:td,debtId:'d_loan',category:'Debt repayment',active:true,done:[],u:0});
  S.rules.push({id:'r_card',type:'debt',name:'Credit card repayment',amount:140,day:null,start:'2026-12',end:null,from:td,debtId:'d_card',category:'Debt repayment',active:true,done:[],u:0});
  S.seeded=true;
}

/* ---------- derived figures (balances are computed, never overwritten) ---------- */
const debtBal=d=>{let b=d.base||0;for(const t of S.txns)if(t.type==='debt'&&t.debtId===d.id&&(t.created||0)>(d.baseAt||0))b-=t.amount;return r3(Math.max(0,b))};
const goalSaved=g=>{let b=g.base||0;for(const t of S.txns)if(t.type==='saving'&&t.goalId===g.id&&(t.created||0)>(g.baseAt||0))b+=t.amount;return r3(b)};
function cash(){ if(!S.cash)return null; let b=S.cash.amount; for(const t of S.txns)if((t.created||0)>S.cash.at)b+=t.type==='income'?t.amount:-t.amount; return r3(b); }
function totals(k){
  const t={income:0,expense:0,debt:0,saving:0,byCat:{}};
  for(const x of S.txns){ if(x.date.slice(0,7)!==k)continue; t[x.type]+=x.amount; if(x.type==='expense')t.byCat[x.category]=(t.byCat[x.category]||0)+x.amount; }
  t.left=t.income-t.expense-t.debt-t.saving; return t;
}
function avg(type){
  const cur=mk(new Date()), vals=[];
  for(let i=1;i<=3;i++){ const m=shiftM(cur,-i); if(S.txns.some(t=>t.date.slice(0,7)===m))vals.push(totals(m)[type]); }
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
const rfreq=r=>r.freq||'monthly';
const ruleActiveIn=(r,m)=>{ if(!r.active)return false; const f=rfreq(r); if(f==='once')return !!r.date&&r.date.slice(0,7)===m; if(f==='yearly')return +m.slice(5,7)===r.month&&m>=r.start&&(!r.end||m<=r.end); return m>=r.start&&(!r.end||m<=r.end); };
function dueList(r,fromDs,toDs){

/* ---------- debt-free simulator ---------- */

function normalise(o){
  const b=blank(); if(!o||typeof o!=='object')return b;
  for(const k of Object.keys(b))if(o[k]!=null&&typeof o[k]===typeof b[k]&&Array.isArray(o[k])===Array.isArray(b[k]))b[k]=o[k];
  b.cash=(o.cash&&typeof o.cash.amount==='number')?o.cash:null;
  if(!o.v||o.v<3){ const now=Date.now();
    if(typeof o.openingBalance==='number')b.cash={amount:o.openingBalance,at:Date.parse((o.openingDate||todayStr())+'T00:00:00')};
    b.txns.forEach(t=>{if(!t.created)t.created=Date.parse(t.date+'T12:00:00')||0;});
    b.debts.forEach(d=>{if(d.base==null){d.base=d.balance||0;d.baseAt=now;}delete d.balance;});
    b.goals.forEach(g=>{if(g.base==null){g.base=g.saved||0;g.baseAt=now;}delete g.saved;});
    b.rules.forEach(r=>{if(!r.from)r.from='0000-00-00';});
  }
  b.rules.forEach(r=>{if(!Array.isArray(r.done))r.done=[];});
  b.strategy=Object.assign({method:'auto',buffer:null,u:0},b.strategy); b.v=3; b.updated=o.updated||0; return b;
}
function mergeIn(n){
  const before=S.txns.length, del=new Set([...S.deleted,...n.deleted]);
  const ids=new Set(S.txns.map(t=>t.id)), autoK=new Set(S.txns.filter(t=>t.auto).map(t=>t.ruleId+'|'+t.period));
  for(const t of n.txns){ if(del.has(t.id))continue; if(ids.has(t.id)){ const i=S.txns.findIndex(x=>x.id===t.id); if((t.u||0)>(S.txns[i].u||0))S.txns[i]=t; continue; } if(t.auto){const k=t.ruleId+'|'+t.period; if(autoK.has(k))continue; autoK.add(k);} S.txns.push(t); }
  S.txns=S.txns.filter(t=>!del.has(t.id));
  const ml=(a,b)=>{const m=new Map(a.map(x=>[x.id,x])); for(const x of b){const c=m.get(x.id); if(!c||(x.u||0)>(c.u||0))m.set(x.id,x);} return [...m.values()].filter(x=>!del.has(x.id));};
  const oldRules=new Map([...S.rules,...n.rules].map(r=>[r.id+'|'+(S.rules.includes(r)?'a':'b'),r]));
  S.debts=ml(S.debts,n.debts); S.goals=ml(S.goals,n.goals); S.actions=ml(S.actions,n.actions);
  const rs=ml(S.rules,n.rules); for(const r of rs){ const a=oldRules.get(r.id+'|a'),b=oldRules.get(r.id+'|b'); r.done=[...new Set([...(a?a.done:[]),...(b?b.done:[])])]; } S.rules=rs;
  if((n.budgetsU||0)>(S.budgetsU||0)){S.budgets=n.budgets;S.budgetsU=n.budgetsU;}
  if(n.cash&&(!S.cash||n.cash.at>S.cash.at))S.cash=n.cash;
  if((n.strategy.u||0)>(S.strategy.u||0))S.strategy=n.strategy;
  for(const[d,c]of Object.entries(n.checkins||{})){ const m=S.checkins[d]; if(!m||(c.u||0)>(m.u||0))S.checkins[d]=c; }
  { const best={}; for(const t of S.txns)if(t.ci&&(!best[t.ci]||(t.created||0)>(best[t.ci].created||0)))best[t.ci]=t; S.txns=S.txns.filter(t=>!t.ci||best[t.ci]===t); }
  S.reviews=Object.assign({},n.reviews,S.reviews); S.deleted=[...del]; S.setupDone=S.setupDone||n.setupDone; S.seeded=true;
  return S.txns.length-before;
}

async function initStore(){
  let local=null; try{const s=localStorage.getItem('rafiq.v1'); if(s)local=normalise(JSON.parse(s));}catch(e){}
  if(SA){ if(local)S=local; setStore('Saved on this iPhone','ok'); try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){} try{navigator.serviceWorker&&navigator.serviceWorker.register('sw.js');}catch(e){} return boot(false); }
  if(OFF){ const d=window.RAFIQ_DATA; S=d?normalise(d):(local||blank()); setStore('Offline · saved on iPhone','ok'); return boot(false); }
  if(local)S=local; render();
  let remoteHad=false;

    if(typeof claude==='undefined')throw 0;
    const user=await claude.use('user'), db=await claude.use('db'); if(!user||!db)throw 0;
    const id=await user.id(); if(!id)throw 0;

    if(snap.exists){ remoteHad=true; const d=snap.data(); const remote=normalise(JSON.parse(d.json)); remote.updated=d.updated||0; if(!local||remote.updated>=(local.updated||0))S=remote; }
    setStore('Saved','ok');

}
function boot(force){
  curJson=JSON.stringify(S);
  const had=S.txns.length||S.debts.length||S.goals.length||S.rules.length; let ch=false;
  if(!S.seeded&&!had){seed();ch=true;}
  if(runRules()>0)ch=true;

  if(OFF&&window.RAFIQ_INCOMING){ try{ const n=normalise(window.RAFIQ_INCOMING); if(n.updated>(S.lastIncoming||0)){ const keep=n.updated, c=mergeIn(n); S.lastIncoming=keep; runRules(); ch=true; note='Online backup merged'+(c>0?' · '+c+' new':''); } }catch(e){} }
  if(snapToday())ch=true;
  if(ch||force)save(); else localSave();
  render(); if(note)setTimeout(()=>toast(note),400);
  if(!S.setupDone)setTimeout(()=>A.setup(),350);

/* ---------- Google Drive backup (online only) ---------- */
async function getMcp(){ if(mcpRef===undefined){ try{mcpRef=(!OFF&&typeof claude!=='undefined')?await claude.use('mcp'):null;}catch(e){mcpRef=null;} } return mcpRef; }
async function drive(tool,input){ const m=await getMcp(); if(!m)throw {code:'unavailable'}; const r=await m.callTool('Google Drive',tool,input); return r&&r.payload!==undefined?r.payload:r; }
const filesOf=p=>Array.isArray(p)?p:(p&&(p.files||p.results||p.items))||[];
const fid=f=>f&&(f.id||f.fileId), ftitle=f=>f&&(f.title||f.name)||'', fmod=f=>f&&(f.modifiedTime||f.modified_time||f.updatedTime)||null;
function driveErr(e){
  const c=e&&e.code;
  if(c==='server_not_connected'||c==='selection_required')return 'Google Drive is not connected. Add it in Claude Settings → Connectors.';
  if(c==='needs_reauth')return 'Reconnect Google Drive in Claude Settings → Connectors.';
  if(c==='approval_required'||c==='not_in_manifest'||c==='consent_required')return 'Google Drive access was not allowed. Tap “Back up to Drive now” and allow it.';
  if(c==='unavailable'||c==='not_granted'||c==='capability_disabled')return 'Drive backup is not available in this view. Open RAFIQ inside Claude to use it.';
  return 'Drive backup failed ('+(c||'error')+'). Your data is still saved in your account.';
}
async function ensureFolder(){
  if(meta.folderId)return meta.folderId;
  const p=await drive('search_files',{query:"title = 'RAFIQ Backups' and mimeType = 'application/vnd.google-apps.folder' and trashed = false",pageSize:3,excludeContentSnippets:true});
  let f=filesOf(p)[0];
  if(!f){ try{ f=await drive('create_file',{title:'RAFIQ Backups',mimeType:'application/vnd.google-apps.folder'}); }catch(e){ return null; } }
  const id=fid(f); if(id){meta.folderId=id;saveMeta();} return id||null;
}
const hasData=()=>S.txns.length||S.cash||S.goals.length||Object.keys(S.budgets).length||S.setupDone;
async function backupNow(){
  if(!hasData())throw {code:'empty'};
  const d=new Date(), name=`RAFIQ-backup-${todayStr()}-${p2(d.getHours())}${p2(d.getMinutes())}.json`;
  const folder=await ensureFolder().catch(()=>null), snapU=S.updated;

async function listBackups(){

}
function decodeBackup(p){
  const c=[]; (function w(v){ if(typeof v==='string')c.push(v); else if(v&&typeof v==='object')Object.values(v).forEach(w); })(p);
  for(const s of c){ for(const f of [()=>s,()=>new TextDecoder().decode(Uint8Array.from(atob(s),x=>x.charCodeAt(0)))]){
    try{ const o=JSON.parse(f()); const d=o&&o.data&&Array.isArray(o.data.txns)?o.data:o; if(d&&Array.isArray(d.txns)&&Array.isArray(d.debts))return d; }catch(e){} } }
  return null;
}

  afford(){

    const delay=b.clear&&w.clear?w.months-b.months:null, share=rec.free>0?amt/rec.free:null;

    if(st&&amt>st.s){tone='bad';verdict='No — not before payday.';}

    else if((share!=null&&share>0.25)||(delay&&delay>=1)){tone='warn';verdict='Possible, but it costs you.';}

    if(share!=null)lines.push(`That is <b>${Math.round(share*100)}%</b> of this month’s free cash (${money(rec.free)}).`);
    if(delay!=null&&S.debts.some(d=>debtBal(d)>0))lines.push(delay>0?`If this money would otherwise go to debt, you become debt-free <b>${delay} month${delay>1?'s':''} later</b>.`:'No visible effect on your debt-free date.');

/* ---------- charts ---------- */
const pct=(a,b)=>b>0?Math.min(100,Math.max(0,a/b*100)):0;
function gauge(sc){
  const th=Math.PI*(1-sc/100), x=60+48*Math.cos(th), y=60-48*Math.sin(th), col=sc>=70?'var(--good)':sc>=40?'var(--warn)':'var(--bad)';
  return `<svg viewBox="0 0 120 68" width="132" role="img" aria-label="Health score ${sc} of 100"><path d="M12 60 A48 48 0 0 1 108 60" stroke="var(--bar)" stroke-width="10" fill="none" stroke-linecap="round"/>${sc>0?`<path d="M12 60 A48 48 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" stroke="${col}" stroke-width="10" fill="none" stroke-linecap="round"/>`:''}<text x="60" y="57" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">${sc}</text></svg>`;
}
function lineChart(sets,o){
  o=o||{}; const W=320,H=o.h||130,pt=12,pb=18,n=Math.max(...sets.map(s=>s.v.length)); if(n<2)return '';
  const all=sets.flatMap(s=>s.v); let lo=Math.min(0,...all), hi=Math.max(...all); if(hi<=lo)hi=lo+1;
  const X=i=>4+(W-8)*i/(n-1), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g=lo<0?`<line x1="0" x2="${W}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--bad)" stroke-dasharray="3 3" stroke-width="1"/>`:`<line x1="0" x2="${W}" y1="${Y(lo).toFixed(1)}" y2="${Y(lo).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  for(const s of sets){ const d=s.v.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
    if(s.fill)g+=`<path d="${d}L${X(s.v.length-1).toFixed(1)} ${Y(Math.max(lo,0)).toFixed(1)}L${X(0)} ${Y(Math.max(lo,0)).toFixed(1)}Z" fill="${s.c}" opacity=".13"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.2}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`; }
  for(const l of (o.labels||[]))g+=`<text x="${X(l.i).toFixed(1)}" y="${H-3}" text-anchor="${l.i===0?'start':l.i>=n-1?'end':'middle'}" font-size="10" fill="var(--mut)">${esc(l.t)}</text>`;
  for(const p of (o.pts||[]))g+=`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="${p.c}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.aria||'chart')}">${g}</svg>`;
}
function donut(list){
  const tot=list.reduce((s,e)=>s+e[1],0); if(!tot)return ''; const R=38,C=2*Math.PI*R; let off=0;
  const segs=list.map((e,i)=>{const len=e[1]/tot*C, s=`<circle r="${R}" cx="50" cy="50" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="15" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 50 50)"/>`; off+=len; return s;}).join('');
  return `<div class="row" style="flex-wrap:nowrap;gap:14px"><svg viewBox="0 0 100 100" width="104" style="flex:none" role="img" aria-label="Spending by category">${segs}<text x="50" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${m0(tot)}</text></svg><div class="lg">${list.map((e,i)=>`<span><span><i class="dot" style="background:${PAL[i%PAL.length]}"></i>${esc(e[0])}</span><b>${Math.round(e[1]/tot*100)}%</b></span>`).join('')}</div></div>`;
}
function trendBars(){
  const ks=[5,4,3,2,1,0].map(i=>shiftM(mk(new Date()),-i)), d=ks.map(k=>{const t=totals(k);return{k,i:t.income,o:t.expense,dp:t.debt+t.saving};});
  const mx=Math.max(1,...d.flatMap(x=>[x.i,x.o+x.dp])), W=300,H=100,bw=14;
  return `<svg viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="Income versus outflow, last six months">${d.map((x,j)=>{const cx=j*50+25,hi=x.i/mx*H,ho=x.o/mx*H,hd=x.dp/mx*H;
    return `<rect x="${cx-bw-1}" y="${H-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--acc)"/><rect x="${cx+1}" y="${H-ho-hd}" width="${bw}" height="${hd}" rx="0" fill="#c9a24a"/><rect x="${cx+1}" y="${H-ho}" width="${bw}" height="${ho}" rx="0" fill="#9aa39e"/><text x="${cx}" y="${H+14}" text-anchor="middle" font-size="10" fill="var(--mut)">${shortM(x.k)}</text>`;}).join('')}</svg>
    <div class="row sm mut"><span><i class="dot" style="background:var(--acc)"></i>Income</span><span><i class="dot" style="background:#9aa39e"></i>Spending</span><span><i class="dot" style="background:#c9a24a"></i>Debt + savings</span></div>`;
}
function forecast(days){
  const c=cash(); if(c==null)return null;
  const t0=midnight(), bt=Object.values(S.budgets).reduce((a,b)=>a+b,0), k=mk(t0), sp=totals(k).expense;
  const curBurn=bt>0?Math.max(0,bt-sp)/Math.max(1,daysIn(k)-t0.getDate()):0;
  const ev={}; for(const o of occ(days)){ if(o.diff<1)continue; ev[o.diff]=(ev[o.diff]||0)+(o.r.type==='income'?o.r.amount:-o.r.amount); }
  let bal=c; const v=[c]; let low={v:c,i:0};
  for(let i=1;i<=days;i++){ const d=new Date(t0); d.setDate(d.getDate()+i); const dk=mk(d); bal+=(ev[i]||0)-(dk===k?curBurn:bt/daysIn(dk)); v.push(bal); if(bal<low.v)low={v:bal,i}; }
  return {v,low,t0};
}

  if(OFF||SA)return h+card(`<div class="sm mut">The chat needs the online version inside Claude. Everything above works offline.</div>`);
  h+=`<div class="msgs" id="msgs"></div>
    <div class="row" style="margin-bottom:8px"><button class="chip" onclick="A.quick('Review my position and tell me the single most important thing to do this week.')">What matters most?</button><button class="chip" onclick="A.quick('Build me a plan to become debt-free as fast as is realistic, with monthly numbers.')">Fastest debt-free plan</button><button class="chip" onclick="A.prefill('Should I ')">Should I…?</button></div>

  return h;
};

        if(Math.abs(diff)>=0.01)S.txns.push({id:uid(),type:diff<0?'expense':'income',amount:Math.abs(diff),date:todayStr(),category:diff<0?'Untracked spending':'Balance correction',note:'Balance check',recon:true,created:now-1});

  },

      <h2 class="t">One commitment for this week</h2>
      ${pb.map((m,i)=>`<label class="item" style="display:flex;gap:8px;align-items:flex-start"><input type="radio" name="pick" value="${i}" ${i===0?'checked':''} style="width:auto;margin:3px 0 0"><span><b>${esc(m.title)}</b><br><span class="sm mut">${esc(m.why)}</span></span></label>`).join('')}

function paintChat(){
  const el=$('#msgs'); if(!el)return;
  el.innerHTML=S.chat.length?S.chat.map((m,i)=>`<div class="b ${m.role==='user'?'u':'a'}">${mdLite(m.content)}${m.action&&!m.added?`<div style="margin-top:8px"><button class="btn sm" onclick="A.takeAction(${i})">Commit: ${esc(m.action)}</button></div>`:''}</div>`).join(''):'<div class="empty sm">Ask about any money decision. I use only what you have recorded and I will tell you if a choice sets you back.</div>';
}
Object.assign(A,{
  prefill(t){const e=$('#ci'); e.value=t; e.focus();},
  quick(t){$('#ci').value=t; A.send();},
  clearChat(){S.chat=[];save();paintChat();},
  takeAction(i){const m=S.chat[i]; m.added=true; S.actions.push({id:uid(),text:m.action,due:eom(),done:false,created:todayStr(),u:Date.now()}); save(); render();},
  async send(){
    const inp=$('#ci'), text=inp.value.trim(); if(!text)return;
    if(sampleFn===undefined){ try{sampleFn=(typeof claude!=='undefined')?await claude.use('sample'):null;}catch(e){sampleFn=null;} }
    if(!sampleFn){ $('#cnote').textContent='Chat is not available in this view. The playbook still works.'; return; }
    inp.value=''; $('#cs').disabled=true; $('#cnote').textContent='';
    S.chat.push({role:'user',content:text}); const reply={role:'assistant',content:'Thinking…'}; S.chat.push(reply); paintChat();
    const hist=S.chat.slice(-14,-2).map(m=>(m.role==='user'?'User: ':'Rafiq: ')+m.content).join('\n');
    const prompt=`You are RAFIQ, the user's personal money consultant and accountability partner (not a licensed financial advisor). Your job is to get them out of debt and keep them on plan, not to summarise.
Rules: use ONLY the recorded data below; never invent balances, transactions or commitments; flag estimates (estimate:true) and missing figures; currency JOD; protect essential commitments and liquidity first; challenge decisions that set them back, directly but respectfully, and quantify the cost (e.g. months added to debt-free date, % of free cash); give a clear recommendation with numbers, not options lists; when cashRescue is present the user needs spendable cash now, so lead with which of its options to use (least costly first, in order) and what each one costs later, and never tell them to spend zero; plain English, under 150 words. If data needed is missing, say exactly what to record.
End with ONE concrete commitment on its own final line, exactly: ACTION: <short imperative sentence>. Omit only if none makes sense.

RECORDED DATA AND RAFIQ'S OWN CALCULATIONS (JSON):
${JSON.stringify(snapshot())}

CONVERSATION SO FAR:
${hist||'(none)'}

User: ${text}
Rafiq:`;
    try{
      const res=await sampleFn(prompt,{cache:false,onText:({text})=>{reply.content=text.replace(/\n?ACTION:.*$/s,'')||'Thinking…';paintChat();}});
      const m=res.text.match(/ACTION:\s*(.+)\s*$/m); reply.content=res.text.replace(/\n?ACTION:.*$/s,'').trim(); if(m)reply.action=m[1].trim().slice(0,160);
    }catch(e){ reply.content=(e&&e.code==='not_granted')?'Chat is not enabled for this view.':(e&&e.code==='rate_limited')?'Too many requests. Wait a moment and try again.':'I could not reach Claude just now. Your data is safe; try again.'; }
    save(); paintChat(); const b=$('#cs'); if(b)b.disabled=false;
  }
});
function snapshot(){

    thisMonthPlan:plan(k),recommendation:rec,
    debtFree:{scheduledOnly:b.clear?b.end:'never',withSuggestedExtra:w?{extra:rec.extra,end:w.end,monthsSooner:b.clear&&w.clear?b.months-w.months:null}:null,order:method()},
    healthScore:hl.score,healthParts:hl.parts.map(p=>({name:p.n,score:Math.round(p.v/25*100),note:p.note})),
    playbook:playbook().map(m=>m.title),

    months:[0,1,2].map(i=>{const m=shiftM(k,-i),t=totals(m);return{month:m,income:r3(t.income),spending:r3(t.expense),debtPayments:r3(t.debt),savings:r3(t.saving),spendingByCategory:r(t.byCat)}}),
    monthlyBudgets:S.budgets,
    debts:S.debts.map(d=>({name:d.name,balance:debtBal(d),estimate:!!d.est,aprPercent:d.rate||null})),
    goals:S.goals.map(g=>({name:g.name,target:g.target,saved:goalSaved(g),deadline:g.deadline})),
    openCommitments:S.actions.filter(a=>!a.done).map(a=>({text:a.text,due:a.due})),daysSinceLastLog:daysSinceLog()};
}
