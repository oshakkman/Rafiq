/* ---------- derived figures (balances are computed, never overwritten) ---------- */
const debtBal=d=>{let b=d.base||0;for(const t of S.txns)if(t.type==='debt'&&t.debtId===d.id&&(t.created||0)>(d.baseAt||0))b-=t.amount;return r3(Math.max(0,b))};

function totals(k){

}
function avg(type){

  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}
const rfreq=r=>r.freq||'monthly';
const ruleActiveIn=(r,m)=>{ if(!r.active)return false; const f=rfreq(r); if(f==='once')return !!r.date&&r.date.slice(0,7)===m; if(f==='yearly')return +m.slice(5,7)===r.month&&m>=r.start&&(!r.end||m<=r.end); return m>=r.start&&(!r.end||m<=r.end); };
function dueList(r,fromDs,toDs){

  if(f==='yearly'){ if(!r.month||!r.day)return out; for(let y=+fromDs.slice(0,4);y<=+toDs.slice(0,4);y++){ const m=y+'-'+p2(r.month), ds=m+'-'+p2(Math.min(r.day,daysIn(m))); if(ds>=fromDs&&ds<=toDs&&m>=(r.start||'')&&(!r.end||m<=r.end))out.push({ds,per:String(y)}); } return out; }
  if(!r.day||!/^\d{4}-\d{2}$/.test(r.start||''))return out;
  for(let m=fromDs.slice(0,7)<r.start?r.start:fromDs.slice(0,7);m<=toDs.slice(0,7)&&(!r.end||m<=r.end);m=shiftM(m,1)){ const ds=m+'-'+p2(Math.min(r.day,daysIn(m))); if(ds>=fromDs&&ds<=toDs)out.push({ds,per:m}); }
  return out;
}
const annualMonthly=()=>S.rules.filter(r=>r.active&&rfreq(r)==='yearly'&&r.type!=='income').reduce((s,r)=>s+r.amount,0)/12;
function plan(m){
  let inc=0,fixed=0,debt=0; for(const r of S.rules){ if(!ruleActiveIn(r,m))continue; if(r.type==='income')inc+=r.amount; else if(rfreq(r)!=='yearly'){fixed+=r.amount; if(r.type==='debt')debt+=r.amount;} }
  const bud=spreadMonthly(), ann=annualMonthly(); return{inc,fixed,debt,bud,ann,free:inc-fixed-bud-ann};
}
function occ(days){
  const out=[], t0=midnight(), td=dstr(t0), e=new Date(t0); e.setDate(e.getDate()+days); const end=dstr(e);
  for(const r of S.rules){ if(!r.active)continue;
    for(const d of dueList(r,td,end)){ if(r.done.includes(d.per)||d.ds<=(r.from||''))continue;
      const dt=new Date(d.ds+'T00:00:00'); out.push({r,dt,diff:Math.round((dt-t0)/864e5),ds:d.ds,per:d.per}); } }
  return out.sort((a,b)=>a.diff-b.diff);
}
function safeToSpend(){
  const c=cash(); if(c==null)return null;
  const p=occ(45).find(o=>o.r.type==='income'&&rfreq(o.r)==='monthly');
  const t0=midnight(), eom=daysIn(mk(t0))-t0.getDate()+1, lim=p?p.diff:eom;
  const outs=occ(lim).filter(o=>o.r.type!=='income'&&o.diff<lim).reduce((s,o)=>s+o.r.amount,0);
  const hold=!(S.strategy.noReserveUntil&&todayStr()<=S.strategy.noReserveUntil), reserve=!hold?0:occ(120).filter(o=>o.r.type!=='income'&&rfreq(o.r)!=='monthly'&&!o.r.moved&&o.diff>=lim).reduce((s,o)=>s+o.r.amount*lim/o.diff,0);
  const s=c-outs-reserve; return {s,outs,reserve,days:Math.max(1,lim),perDay:s/Math.max(1,lim),payday:p};
}
function pace(k){
  const t=totals(k), bt=Object.values(S.budgets).reduce((a,b)=>a+b,0), now=new Date(), isCur=k===mk(now), dim=daysIn(k), day=isCur?now.getDate():dim;
  const exp=bt*day/dim, proj=isCur&&day>0?t.expense/day*dim:t.expense;
  return {bt,spent:t.expense,exp,proj,day,dim,isCur,perDay:isCur?(bt-t.expense)/Math.max(1,dim-day+1):0};
}
function daysSinceLog(){ const ts=S.txns.filter(t=>!t.auto).map(t=>t.created||0); if(!ts.length)return null; return Math.floor((Date.now()-Math.max(...ts))/864e5); }

/* ---------- spread costs: monthly or yearly, no fixed date ---------- */
const spPer=x=>x.per==='year'?'year':'month';
const freeTx=t=>t.type==='expense'&&!t.sid&&!t.auto&&!t.recon&&!t.imp;
const spreadMonthly=()=>S.spreads.reduce((a,x)=>a+(spPer(x)==='year'?x.amount/12:x.amount),0);
const spreadDaily=()=>S.spreads.reduce((a,x)=>a+(spPer(x)==='year'?x.amount/365:x.amount/30.4),0);
const matchSpread=c=>{ const k=String(c||'').trim().toLowerCase(); return k?S.spreads.find(x=>x.name.trim().toLowerCase()===k):null; };
function spreadInfo(days){
  const t0=midnight(), y=t0.getFullYear(), k=mk(t0), td=todayStr();
  return S.spreads.map(x=>{ const yr=spPer(x)==='year', st=yr?y+'-01-01':k+'-01', pd=yr?Math.round((new Date(y+1,0,1)-new Date(y,0,1))/864e5):daysIn(k), dayOf=yr?Math.floor((t0-new Date(y,0,1))/864e5)+1:t0.getDate();
    const used=S.txns.filter(t=>t.type==='expense'&&t.sid===x.id&&t.date>=st&&t.date<=td).reduce((a,t)=>a+t.amount,0), left=Math.max(0,x.amount-used), perDay=x.amount/pd, exp=x.amount*dayOf/pd;
    return {x,used,left,perDay,exp,pd,dayOf,res:Math.min(left,perDay*(days||0)),over:used>x.amount+0.005,ahead:used>exp*1.1+0.5}; });

/* ---------- daily coach: target, check-in, streak ---------- */
const dstr=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const spentOn=ds=>S.txns.filter(t=>freeTx(t)&&t.date===ds).reduce((s,t)=>s+t.amount,0);
function pattern(){
  const by=[0,1,2,3,4,5,6].map(()=>({n:0,s:0,over:0})), cutD=dstr(new Date(Date.now()-56*864e5));
  for(const[ds,c]of Object.entries(S.checkins)){ if(!c.done||ds<cutD)continue; const b=by[new Date(ds+'T00:00:00').getDay()]; b.n++; b.s+=c.spent; if(c.spent>c.target+0.005)b.over++; }
  const n=by.reduce((a,b)=>a+b.n,0), tot=by.reduce((a,b)=>a+b.s,0); if(n<14||tot<=0)return {ready:false,n,by};
  const mean=tot/n; return {ready:true,n,by,mean,w:by.map(b=>b.n>=2?clamp((b.s/b.n)/mean,0.6,1.6):1)};
}
function dayTarget(){
  const st=safeToSpend(); if(!st)return null;
  const td=todayStr(), sp=S.txns.filter(t=>freeTx(t)&&t.date===td&&(t.created||0)>S.cash.at).reduce((s,t)=>s+t.amount,0), sres=spreadInfo(st.days).reduce((a,x)=>a+x.res,0), pool=st.s+sp-sres;
  let t=pool/st.days, why='your cash until '+(st.payday?'payday':'month end');
  const pt=pattern(); if(pt.ready){ let sum=0; const t0=midnight(); for(let i=0;i<st.days;i++){ const d=new Date(t0); d.setDate(d.getDate()+i); sum+=pt.w[d.getDay()]; } t=pool*pt.w[t0.getDay()]/sum; why+=' and your weekly pattern'; }
  const cap=S.strategy.dailyCap; if(cap>0&&cap<t){t=cap;why='your own daily limit';}
  t=Math.max(0,Math.floor(t*2)/2);
  const fl=floorAmt(), low=S.setupDone&&t<fl; if(low){t=fl;why='your daily minimum, because cash is short';}
  return {t,spent:spentOn(td),why,st,low,sres,pool,pat:pt.ready,cap:S.strategy.dailyCap>0&&why==='your own daily limit'};
}
/* ---------- cash rescue: free up cash now, least costly first ---------- */
const floorAmt=()=>S.strategy.floor>0?S.strategy.floor:5;
function rescue(){
  const st=safeToSpend(); if(!st||!S.setupDone)return null;
  const td=todayStr(), sp=S.txns.filter(t=>freeTx(t)&&t.date===td&&(t.created||0)>S.cash.at).reduce((a,t)=>a+t.amount,0), sres=spreadInfo(st.days).reduce((a,x)=>a+x.res,0);
  const fl=floorAmt(), gap=r3(fl*st.days-(st.s+sp-sres)); if(gap<=0.005)return {on:false};
  const L=[], due=occ(st.days).filter(o=>o.r.type!=='income'&&o.diff<st.days), after=st.payday?'after payday':'to next month', a=(o,k)=>`A.rs('${k}','${o.r.id}','${o.per}')`;
  for(const o of due)if(o.r.type==='debt'&&o.r.extra)L.push({amt:o.r.amount,tone:'good',title:'Skip this month’s '+o.r.name,cost:'Costs nothing now. Your debt-free date moves about one payment later.',btn:'Skip this one',act:a(o,'skip')});
  for(const o of due)if(o.r.type==='saving')L.push({amt:o.r.amount,tone:'good',title:'Pause this month’s saving: '+o.r.name,cost:'No fee. The goal is reached a month later.',btn:'Pause this one',act:a(o,'skip')});
  if(st.reserve>0.5)L.push({amt:r3(st.reserve),tone:'good',title:'Release money held for upcoming yearly bills',cost:'You will need to set aside more per day after payday to catch up.',btn:'Release it',act:"A.rs('reserve')"});
  for(const g of S.goals){ const sv=goalSaved(g); if(sv>0.5)L.push({amt:r3(Math.min(sv,gap)),tone:'warn',title:'Use money from “'+g.name+'”',cost:'This is what savings are for, but rebuild it once you are paid.',btn:'Use it',act:`A.rs('goal','${g.id}','${r3(Math.min(sv,gap))}')`}); }
  for(const o of due)if(o.r.type==='expense')L.push({amt:o.r.amount,tone:'warn',title:'Move '+o.r.name+' ('+dLabel(o.dt)+') '+after,cost:'Check the provider allows a later date. A late fee or service cut is possible.',btn:'Move it',act:a(o,'defer')});
  for(const o of due)if(o.r.type==='debt'&&!o.r.extra)L.push({amt:o.r.amount,tone:'bad',title:'Ask the bank to defer '+o.r.name+' ('+dLabel(o.dt)+')',cost:'Last resort. Only with the bank’s agreement: an unapproved missed payment brings fees and hurts your record. Adds a month to the debt.',btn:'Bank agreed, move it',act:a(o,'defer')});
  return {on:true,gap,fl,st,levers:L,total:L.reduce((x,l)=>x+l.amt,0)};
}
function ciTarget(ds){ const c=S.checkins[ds]; if(ds!==todayStr()&&c&&c.target!=null)return c.target; const d=dayTarget(); return d?d.t:0; }
function snapToday(){ const td=todayStr(); if(!S.cash||S.checkins[td])return false; const d=dayTarget(); if(!d)return false; S.checkins[td]={target:d.t,u:Date.now()}; return true; }
function pendingDays(){
  if(!S.cash||!S.setupDone)return []; const out=[], t0=midnight(), start=dstr(new Date(S.cash.at));
  for(let i=6;i>=1;i--){ const d=new Date(t0); d.setDate(d.getDate()-i); const ds=dstr(d); if(ds<start)continue; const c=S.checkins[ds]; if(!c||!c.done)out.push({ds,d}); }
  return out;
}
function checkin(ds,total,target){
  const now=Date.now(); for(const o of S.txns.filter(t=>t.ci===ds))S.deleted.push(o.id); S.txns=S.txns.filter(t=>t.ci!==ds);
  const logged=spentOn(ds), top=r3(total-logged);
  if(top>0.0005)S.txns.push({id:uid(),type:'expense',amount:top,date:ds,category:'Daily spending',note:'Daily check-in',ci:ds,created:now});
  S.checkins[ds]={target,spent:r3(Math.max(total,logged)),done:true,u:now}; save(); render();
}
function streak(){ let n=0; const t0=midnight(); for(let i=0;i<365;i++){ const d=new Date(t0); d.setDate(d.getDate()-i); const c=S.checkins[dstr(d)]; if(!c||!c.done){ if(i===0)continue; break; } if(c.spent<=c.target+0.005)n++; else break; } return n; }
function dayName(ds){ const t0=midnight(), d=new Date(ds+'T00:00:00'), diff=Math.round((t0-d)/864e5); return diff===0?'today':diff===1?'yesterday':'on '+dLabel(d); }

/* ---------- debt-free simulator ---------- */
function method(){ const m=S.strategy.method; if(m!=='auto')return m; return S.debts.some(d=>d.rate>0&&debtBal(d)>0)?'avalanche':'snowball'; }
function sched(d,m,cur){
  const rs=S.rules.filter(r=>r.type==='debt'&&r.debtId===d.id&&ruleActiveIn(r,m)&&!(m===cur&&r.done.includes(m)));
  if(rs.length)return rs.reduce((s,r)=>s+r.amount,0);
  const hasRule=S.rules.some(r=>r.type==='debt'&&r.debtId===d.id&&r.active), started=S.rules.some(r=>r.type==='debt'&&r.debtId===d.id&&r.active&&m>=r.start);
  if(m===cur||(hasRule&&!started))return 0;
  return d.minPay||0;
}
function sim(extra,bump){
  const cur=mk(new Date()), meth=method();
  const ds=S.debts.map(d=>({id:d.id,name:d.name,b:debtBal(d),r:(d.rate||0)/1200,rate:d.rate||0,src:d})).filter(d=>d.b>0.005);
  if(!ds.length)return {months:0,end:null,interest:0,series:[0],order:[],target:null,clear:true};
  const live=()=>ds.filter(d=>d.b>0.005).sort((a,b)=>meth==='avalanche'?((b.rate-a.rate)||(a.b-b.b)):((a.b-b.b)||(b.rate-a.rate)));
  if(bump>0)live()[0].b+=bump; else if(bump<0){ let rem=-bump; for(const t of live()){ const x=Math.min(t.b,rem); t.b-=x; rem-=x; if(rem<=0.005)break; } }
  if(!live().length)return {months:0,end:mk(new Date()),interest:0,series:[0],order:[],target:null,clear:true};
  const target=live()[0], series=[ds.reduce((s,d)=>s+d.b,0)], order=[]; let interest=0,m=cur,i=0;
  while(ds.some(d=>d.b>0.005)&&i<480){
    let pool=i>0?extra:0;
    for(const d of S.debts){ const x=ds.find(y=>y.id===d.id);
      if(!x){ pool+=S.rules.filter(r=>r.type==='debt'&&r.debtId===d.id&&ruleActiveIn(r,m)&&!(m===cur&&r.done.includes(m))).reduce((s,r)=>s+r.amount,0); continue; }
      const sc=sched(d,m,cur); if(x.b<=0.005){pool+=sc;continue;}
      const it=x.b*x.r; x.b+=it; interest+=it; const pay=Math.min(sc,x.b); x.b-=pay; pool+=sc-pay; }
    for(const t of live()){ if(pool<=0)break; const pay=Math.min(pool,t.b); t.b-=pay; pool-=pay; }
    for(const d of ds)if(d.b<=0.005&&!d.fin){d.fin=m;order.push({name:d.name,m});}
    i++; series.push(ds.reduce((s,d)=>s+Math.max(0,d.b),0)); m=shiftM(m,1);
  }
  const clear=!ds.some(d=>d.b>0.005);

}
function dailyBurn(){ const v=[], t0=midnight(); for(let i=1;i<=21;i++){ const d=new Date(t0); d.setDate(d.getDate()-i); const c=S.checkins[dstr(d)]; if(c&&c.done)v.push(c.spent); } if(v.length>=3)return v.reduce((a,b)=>a+b,0)/v.length;
  const im=S.txns.filter(t=>t.imp&&t.type==='expense'&&!t.sid&&!t.billish); if(im.length<5)return null; const ds=im.map(t=>t.date).sort(), days=Math.max(14,Math.round((new Date(ds[ds.length-1])-new Date(ds[0]))/864e5)+1); return im.reduce((a,t)=>a+t.amount,0)/days; }

function recommend(){

/* ---------- health score ---------- */

  if(inc>0){ const ratio=pl.debt/inc; parts.push({n:'Debt burden',v:clamp(25*(0.4-ratio)/0.3,0,25),note:Math.round(ratio*100)+'% of income goes to debt (healthy: under 15%)'}); }
  { const dn=Object.entries(S.checkins).filter(([d,c])=>c.done).sort().slice(-14).map(x=>x[1]); if(dn.length>=3){ const ok=dn.filter(c=>c.spent<=c.target+0.005).length; parts.push({n:'Spending control',v:25*ok/dn.length,note:`On target ${ok} of your last ${dn.length} days`}); } }

  const due=S.actions.filter(a=>a.due&&a.due<=todayStr()); if(due.length)fv=(fv+25*due.filter(a=>a.done).length/due.length)/2;

    for(const r of loose){ const id=slug(r.name); if(!b.spreads.some(x=>x.id===id))b.spreads.push({id,name:r.name,amount:r.amount,per:'month',u:now}); b.deleted.push(r.id); }

  if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date))throw new Error('Choose a date.');
  const t={id:uid(),type:x.type,amount:r3(x.amount),date:x.date,category:(x.category||'').trim(),note:(x.note||'').trim(),created:Date.now()};
  if(x.type==='debt'){ const d=S.debts.find(d=>d.id===x.debtId); if(!d)throw new Error('Choose a debt.'); t.debtId=d.id; t.category='Debt repayment'; }
  else if(x.type==='saving'){ const g=S.goals.find(g=>g.id===x.goalId); if(!g)throw new Error('Choose a goal.'); t.goalId=g.id; t.category='Savings'; }
  else if(!t.category)t.category=x.type==='income'?'Other income':'Other';
  let sx=null; if(t.type==='expense'){ sx=matchSpread(t.category); if(sx){t.sid=sx.id;t.category=sx.name;} }
  S.txns.push(t); save(); render();

}

/* ---------- charts ---------- */
const pct=(a,b)=>b>0?Math.min(100,Math.max(0,a/b*100)):0;
function gauge(sc){
  const th=Math.PI*(1-sc/100), x=60+48*Math.cos(th), y=60-48*Math.sin(th), col=sc>=70?'var(--good)':sc>=40?'var(--warn)':'var(--bad)';
  return `<svg viewBox="0 0 120 68" width="132" role="img" aria-label="Health score ${sc} of 100"><path d="M12 60 A48 48 0 0 1 108 60" stroke="var(--bar)" stroke-width="10" fill="none" stroke-linecap="round"/>${sc>0?`<path d="M12 60 A48 48 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" stroke="${col}" stroke-width="10" fill="none" stroke-linecap="round"/>`:''}<text x="60" y="57" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">${sc}</text></svg>`;
}
function lineChart(sets,o){
  o=o||{}; const W=320,H=o.h||130,pt=12,pb=18,n=Math.max(...sets.map(s=>s.v.length)); if(n<2)return '';
  const all=sets.flatMap(s=>s.v); let lo=Math.min(0,...all), hi=Math.max(...all); if(hi<=lo)hi=lo+1;
  const X=i=>4+(W-8)*i/(n-1), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g=lo<0?`<line x1="0" x2="${W}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--bad)" stroke-dasharray="3 3" stroke-width="1"/>`:`<line x1="0" x2="${W}" y1="${Y(lo).toFixed(1)}" y2="${Y(lo).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  for(const s of sets){ const d=s.v.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
    if(s.fill)g+=`<path d="${d}L${X(s.v.length-1).toFixed(1)} ${Y(Math.max(lo,0)).toFixed(1)}L${X(0)} ${Y(Math.max(lo,0)).toFixed(1)}Z" fill="${s.c}" opacity=".13"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.2}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`; }
  for(const l of (o.labels||[]))g+=`<text x="${X(l.i).toFixed(1)}" y="${H-3}" text-anchor="${l.i===0?'start':l.i>=n-1?'end':'middle'}" font-size="10" fill="var(--mut)">${esc(l.t)}</text>`;
  for(const p of (o.pts||[]))g+=`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="${p.c}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.aria||'chart')}">${g}</svg>`;
}
function donut(list){
  const tot=list.reduce((s,e)=>s+e[1],0); if(!tot)return ''; const R=38,C=2*Math.PI*R; let off=0;
  const segs=list.map((e,i)=>{const len=e[1]/tot*C, s=`<circle r="${R}" cx="50" cy="50" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="15" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 50 50)"/>`; off+=len; return s;}).join('');
  return `<div class="row" style="flex-wrap:nowrap;gap:14px"><svg viewBox="0 0 100 100" width="104" style="flex:none" role="img" aria-label="Spending by category">${segs}<text x="50" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${m0(tot)}</text></svg><div class="lg">${list.map((e,i)=>`<span><span><i class="dot" style="background:${PAL[i%PAL.length]}"></i>${esc(e[0])}</span><b>${Math.round(e[1]/tot*100)}%</b></span>`).join('')}</div></div>`;
}
function trendBars(){
  const ks=[5,4,3,2,1,0].map(i=>shiftM(mk(new Date()),-i)), d=ks.map(k=>{const t=totals(k);return{k,i:t.income,o:t.expense,dp:t.debt+t.saving};});
  const mx=Math.max(1,...d.flatMap(x=>[x.i,x.o+x.dp])), W=300,H=100,bw=14;
  return `<svg viewBox="0 0 ${W} ${H+18}" width="100%" role="img" aria-label="Income versus outflow, last six months">${d.map((x,j)=>{const cx=j*50+25,hi=x.i/mx*H,ho=x.o/mx*H,hd=x.dp/mx*H;
    return `<rect x="${cx-bw-1}" y="${H-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--acc)"/><rect x="${cx+1}" y="${H-ho-hd}" width="${bw}" height="${hd}" rx="0" fill="#c9a24a"/><rect x="${cx+1}" y="${H-ho}" width="${bw}" height="${ho}" rx="0" fill="#9aa39e"/><text x="${cx}" y="${H+14}" text-anchor="middle" font-size="10" fill="var(--mut)">${shortM(x.k)}</text>`;}).join('')}</svg>
    <div class="row sm mut"><span><i class="dot" style="background:var(--acc)"></i>Income</span><span><i class="dot" style="background:#9aa39e"></i>Spending</span><span><i class="dot" style="background:#c9a24a"></i>Debt + savings</span></div>`;
}
function forecast(days){
  const c=cash(); if(c==null)return null;
  const t0=midnight(), fb=dailyBurn(), pl=plan(shiftM(mk(t0),1)), pf=pl.inc>0?Math.max(0,pl.free)/30.4:null, burn=(fb!=null?fb:pf!=null?pf:((dayTarget()||{}).t||0))+spreadDaily();
  const ev={}; for(const o of occ(days)){ if(o.diff<1)continue; ev[o.diff]=(ev[o.diff]||0)+(o.r.type==='income'?o.r.amount:-o.r.amount); }
  let bal=c; const v=[c]; let low={v:c,i:0};
  for(let i=1;i<=days;i++){ bal+=(ev[i]||0)-burn; v.push(bal); if(bal<low.v)low={v:bal,i}; }
  return {v,low,t0};
}

function monthGrid(){ const t0=midnight(); let h='';
  for(let i=27;i>=0;i--){ const d=new Date(t0); d.setDate(d.getDate()-i); const c=S.checkins[dstr(d)], done=c&&c.done, ok=done&&c.spent<=c.target+0.005; h+=`<i class="${done?(ok?'ok':'no'):''}${i===0?' td':''}"></i>`; }

function flowCard(){ const k=mk(new Date()), t=totals(k), inc=Math.max(t.income,plan(k).inc); if(!(inc>0))return '';
  const used=t.expense+t.debt+t.saving, left=Math.max(0,inc-used), parts=[['Spent',t.expense,'#9aa39e'],['Debt paid',t.debt,'#c9a24a'],['Saved',t.saving,'#4a7fb5'],['Left',left,'var(--acc)']], tot=Math.max(inc,used);

  debtBal(id){ const d=S.debts.find(x=>x.id===id); sheet('Update '+d.name,`<p class="sm mut" style="margin-top:0">Check your bank app and type what you owe today. Or use the weekly balance check: screenshots of cards and loans update debts too.</p><input name="b" type="number" inputmode="decimal" step="0.001" class="amt" value="${debtBal(d)}" autofocus>`,f=>{ const b=num(f.b); if(isNaN(b)||b<0)throw new Error('Enter the amount owed.'); d.base=r3(b); d.baseAt=Date.now(); d.est=false; d.u=Date.now(); save(); render(); toast('Balance updated'); },'Save'); },
  async balCheck(){
    const sm=await getSample();
    sheet('Weekly balance check',`<div class="coach" style="margin:0 0 4px">${mascot('good')}<div class="say">${sm?'Take a screenshot of each account in your bank apps (balance visible), then add them here. I’ll read them for you.':'Type the balance of each account. Screenshot reading works in the Claude version.'}</div></div>
      ${sm?`<label class="drop">${ibx('cash')}<div style="font-weight:800;margin-top:8px">Add screenshots</div><div class="sm mut">Bank accounts, cards and loans · up to 6</div><input type="file" id="bsf" accept="image/*" multiple></label><div class="shots" id="bshots"></div><div id="bstat"></div><div style="text-align:center;margin-top:8px"><button type="button" class="btn ghost sm" onclick="A.balManual()">Type balances instead</button></div>`:''}`,null,null);
    if(!sm)return A.balManual();
    $('#bsf').addEventListener('change',e=>{ const fs=[...e.target.files].slice(0,6); if(fs.length)A.balRead(fs); });
  },
  async balRead(files){
    const box=$('#bshots'); if(box)box.innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}" alt="">`).join('');
    const st=$('#bstat'), say=(i,m)=>{ if(st)st.innerHTML=`<div class="steps">${['Reading your screenshots','Matching accounts and debts'].map((t,k)=>`<div class="${k<i?'ok':k===i?'on':''}"><i>${k<i?'✓':k+1}</i>${t}</div>`).join('')}</div><div class="${m&&m.err?'err':'sm mut'}">${esc(m&&m.t||'')}</div>`; };
    say(0,{t:'Usually 10–30 seconds.'});
    try{
      const sm=await getSample(), lim=sm.limits?await sm.limits().catch(()=>({})):{}; if(lim&&lim.images===false)throw new Error('This view cannot read images. Type the balances instead.');
      const res=await sm.json(`These are screenshots of a person's bank, card and loan apps in Jordan. Extract every account balance shown. ${BAL_SCHEMA}`,{images:files,modelTier:'complex'});
      if(!res||!Array.isArray(res.accounts)||!res.accounts.length)throw new Error('I could not find a balance in those screenshots. Make sure the balance is visible, or type it instead.');
      say(1,{t:''}); balDraft=res.accounts.filter(a=>typeof a.balance==='number'); A.balReview();
    }catch(e){ say(0,{err:1,t:(e&&e.code==='rate_limited')?'Claude is busy. Try again in a minute.':(e&&e.message)||'Could not read those screenshots.'}); }
  },
  balManual(){ balDraft=(S.accounts.length?S.accounts:[{name:'Main account',type:'current',balance:cash()||0}]).map(a=>({name:a.name,type:a.type||'current',balance:a.bal!=null?a.bal:a.balance})); A.balReview(true); },
  balReview(manual){
    const isDebt=t=>t==='credit_card'||t==='loan', norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const guessDebt=a=>{ const n=norm(a.name); return S.debts.find(d=>{ const m=norm(d.name); return (a.type==='credit_card'&&/card/.test(m))||(a.type==='loan'&&/loan/.test(m))||n.includes(m)||m.includes(n); }); };
    const rows=balDraft.map((a,i)=>{ const dbt=isDebt(a.type), g=dbt?guessDebt(a):null;
      return `<div class="acct"><div><input name="n${i}" value="${esc(a.name)}" style="text-align:left;font-weight:700;padding:8px 10px"><select name="k${i}" style="margin-top:6px;padding:8px" onchange="A.balSum()"><option value="cash" ${!dbt?'selected':''}>Counts as my cash</option>${S.debts.map(d=>`<option value="d:${d.id}" ${g&&g.id===d.id?'selected':''}>Debt: ${esc(d.name)}</option>`).join('')}<option value="skip" ${dbt&&!g?'selected':''}>Ignore</option></select></div><input name="b${i}" type="number" inputmode="decimal" step="0.001" value="${r3(a.balance)}" oninput="A.balSum()"></div>`; }).join('');
    const known=S.accounts.filter(x=>!balDraft.some(a=>norm(a.name)===norm(x.name)));
    sheet('Confirm your balances',`<p class="sm mut" style="margin-top:0">${manual?'Type today’s balance for each account.':'Here’s what I read. Fix anything that’s off.'}</p>${rows}
      ${known.length?`<h2 class="t">Not in these screenshots</h2>${known.map(x=>`<label class="it" style="cursor:pointer"><input type="checkbox" name="keep_${x.id}" checked onchange="A.balSum()"><div class="tx"><div>${esc(x.name)}</div><div class="sm mut">Keep last balance from ${ago(x.at)}</div></div><div class="am">${money(x.bal)}</div></label>`).join('')}`:''}
      <button type="button" class="btn sm" style="margin-top:10px" onclick="balDraft.push({name:'Another account',type:'current',balance:0});A.balReview(${!!manual})">+ Add account</button>
      <div class="rv good" style="margin-top:16px" id="bsum"></div>`,
      f=>{ const now=Date.now(); let total=0; const acc=[]; const dUp=[];
        balDraft.forEach((a,i)=>{ const v=num(f['b'+i]), k=f['k'+i], nm=(f['n'+i]||a.name).trim(); if(isNaN(v))return; if(k==='cash'){ total+=v; acc.push({name:nm,type:a.type||'current',bal:r3(v)}); } else if(k&&k.startsWith('d:'))dUp.push([k.slice(2),v]); });
        for(const x of known)if(f['keep_'+x.id]){ total+=x.bal; acc.push({name:x.name,type:x.type,bal:x.bal,keepAt:x.at}); }
        if(!acc.length&&!dUp.length)throw new Error('Enter at least one balance.');
        if(acc.length){ const c=cash(), diff=c==null?0:r3(total-c);
          if(c!=null&&Math.abs(diff)>=0.01)S.txns.push({id:uid(),type:diff<0?'expense':'income',amount:Math.abs(diff),date:todayStr(),category:diff<0?'Untracked spending':'Balance correction',note:'Weekly balance check',recon:true,created:now-1});
          S.cash={amount:r3(total),at:now};
          const old=new Map(S.accounts.map(x=>[norm(x.name),x])); S.accounts=acc.map(x=>{ const o=old.get(norm(x.name)); return {id:o?o.id:uid(),name:x.name,type:x.type,bal:x.bal,at:x.keepAt||now,u:now}; });
          S.balHist.push({at:now,total:r3(total)}); }
        for(const[id,v]of dUp){ const d=S.debts.find(x=>x.id===id); if(d){ d.base=r3(v); d.baseAt=now; d.est=false; d.u=now; } }
        save(); render(); toast(`Balances confirmed${acc.length?' · cash '+money(total):''}${dUp.length?' · '+dUp.length+' debt'+(dUp.length>1?'s':'')+' updated':''}`); },'Confirm balances');
    A.balSum();
  },
  balSum(){ const e=$('#bsum'); if(!e)return; const fm=$('#sf'); if(!fm)return; const fd=new FormData(fm); let t=0;
    balDraft.forEach((a,i)=>{ if(fd.get('k'+i)==='cash'){ const v=num(fd.get('b'+i)); if(!isNaN(v))t+=v; } }); for(const x of S.accounts)if(fd.get('keep_'+x.id))t+=x.bal;
    const c=cash(), d=c==null?0:t-c; e.className='rv '+(Math.abs(d)<1?'good':'bad'); e.innerHTML=`<div class="sm" style="font-weight:700">Your cash total</div><div class="big2">${money(t)} JOD</div><div class="sm">${c==null?'':Math.abs(d)<0.01?'Matches RAFIQ exactly ✓':d<0?money(-d)+' less than RAFIQ thought: recorded as untracked spending':money(d)+' more than RAFIQ thought: recorded as money in'}</div>`; }
});

  const L=[], dt=dayTarget(); L.push({id:'rafiq.daily',daily:[21,0],title:'Close your day with Rafiq',body:dt?`Did you stay within ${money(dt.t)} JOD today? One tap.`:'Tap to check in.'});
  L.push({id:'rafiq.morning',daily:[9,0],title:'Today’s spending',body:dt?`You can spend about ${money(dt.t)} JOD today.`:'Open RAFIQ to see today’s amount.'});
  L.push({id:'rafiq.weekly',weekly:[7,11,0],title:'Weekly balance check',body:'Screenshot your accounts and confirm your balances. 1 minute.'});
  for(const o of occ(14))if(o.r.type!=='income'){ const d=new Date(o.dt); d.setDate(d.getDate()-1); d.setHours(10,0,0,0); if(d>new Date())L.push({id:'rafiq.bill.'+o.r.id+'.'+o.per,at:d.getTime(),title:`${o.r.name} due tomorrow`,body:`${money(o.r.amount)} JOD. Already set aside in your daily amount.`}); }
  const fc=forecast(30); if(fc&&fc.low.v<0&&fc.low.i>2){ const d=new Date(fc.t0.getTime()+(fc.low.i-3)*864e5); d.setHours(12,0,0,0); L.push({id:'rafiq.low',at:d.getTime(),title:'Cash will run short soon',body:`You’re heading ${money(-fc.low.v)} JOD below zero. Open RAFIQ for options.`}); }
  return JSON.stringify(L); }catch(e){ return '[]'; } };
V.spend=()=>{
  const cur=mk(new Date()), isCur=month===cur, t=totals(month), pv=totals(shiftM(month,-1)), dim=daysIn(month), today=new Date().getDate();
  const per=[]; for(let d=1;d<=dim;d++){ const ds=month+'-'+p2(d); per.push(S.txns.filter(x=>x.type==='expense'&&x.date===ds).reduce((a,x)=>a+x.amount,0)); }
  const mx=Math.max(1,...per), days=isCur?today:dim, avgD=t.expense/Math.max(1,days), dlt=t.expense-pv.expense;
  let h=`<div class="pg"><div class="ey">Spending · ${monthLabel(month)}</div><h2>${money(t.expense)} <span style="font-size:16px;color:var(--mut);font-weight:600">JOD</span></h2></div>`;
  h+=`<div class="mn"><button class="ib" onclick="A.mm(-1)" aria-label="Previous month">‹</button><div class="row">${pv.expense>0?`<span class="chip ${dlt>0?'':'ok'}" style="cursor:default">${dlt>0?'▲':'▼'} ${money(Math.abs(dlt))} vs ${shortM(shiftM(month,-1))}</span>`:''}<span class="chip" style="cursor:default">${money(avgD)}/day</span></div><button class="ib" onclick="A.mm(1)" aria-label="Next month">›</button></div>`;
  h+=card(`<h3>Day by day</h3><div class="dg">${per.map((v,i)=>`<i class="${isCur&&i+1>today?'z':isCur&&i+1===today?'td':''}" style="height:${isCur&&i+1>today?2:Math.max(2,v/mx*100)}%" title="${i+1}: ${money(v)}"></i>`).join('')}</div><div class="sp sm mut" style="margin-top:6px"><span>1</span><span>${Math.ceil(dim/2)}</span><span>${dim}</span></div>`);
  if(isCur)h+=card(`<div class="sp" style="margin-bottom:6px"><div><h3 style="margin:0">Spread costs</h3><div class="sm mut">Paid in bits, no fixed date</div></div><button class="btn sm pri" onclick="A.spreadForm()">+ Add</button></div>${spreadRows()||'<div class="sm mut" style="margin-top:6px">Fuel, transport, coffee… anything you pay in bits over a month or a year. Add the total and RAFIQ spreads it across your days, then tracks it as you log.</div>'}`);
  const cats=Object.entries(t.byCat).sort((a,b)=>b[1]-a[1]);
  if(cats.length)h+=card(`<h3>Where it went</h3>${donut(cats.slice(0,6).concat(cats.length>6?[['Other',cats.slice(6).reduce((a,e)=>a+e[1],0)]]:[]))}`);
  const list=S.txns.filter(x=>x.date.slice(0,7)===month&&(actFilter==='all'||x.type===actFilter)).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
  h+=`<div class="qc" style="margin:4px 0 12px">${['all',...Object.keys(TYPES)].map(f=>`<button class="chip ${actFilter===f?'on':''}" onclick="A.filt('${f}')">${f==='all'?'All':TYPES[f]}</button>`).join('')}</div>`;
  if(!list.length)return h+card(`<div class="empty">Nothing logged in ${monthLabel(month)}.<br><span class="sm">Tap the + button to log spending.</span></div>`);
  const by={}; for(const x of list)(by[x.date]=by[x.date]||[]).push(x);
  h+=Object.entries(by).map(([ds,L])=>`<div class="sp" style="margin:4px 4px 8px"><span class="ey">${dayName(ds)==='today'?'Today':dayName(ds)==='yesterday'?'Yesterday':dLabel(new Date(ds+'T00:00:00'))}</span><span class="sm mut">${money(L.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0))}</span></div>`+card(L.map(x=>{ const k=x.type==='income'?'inc':x.type==='debt'?'pay':x.type==='saving'?'save':x.auto?'bill':x.sid?'spread':null;
    return `<div class="it" onclick="A.editTxn('${x.id}')">${k?ibx(k):`<div class="ic" style="background:${catCol(x.category)}">${esc(String(x.category||'?').trim().charAt(0).toUpperCase())}</div>`}<div class="tx"><div>${esc(x.category)}</div><div class="sm mut">${x.auto?'Automatic':x.sid?'Spread cost':x.ci?'Daily check-in':TYPES[x.type]}${x.note&&!x.auto?' · '+esc(x.note):''}</div></div><div class="am ${x.type==='income'?'pos':''}">${x.type==='income'?'+':'−'}${money(x.amount)}</div></div>`; }).join(''))).join('');
  return h;
};
V.activity=V.spend;
V.plan=()=>{
  const back=t=>`<div class="pg"><button class="btn sm" onclick="A.ptab('money')">‹ Money</button><h2 style="margin-top:12px">${t}</h2></div>`;
  if(planTab==='debts')return back('Debts')+V.p_debts(); if(planTab==='goals')return back('Goals')+V.p_goals(); if(planTab==='know')return V.know();
  const c=cash(), ac=accuracy(), fc=forecast(30), k=mk(new Date()), t=totals(k), base=sim(0), owe=S.debts.reduce((a,d)=>a+debtBal(d),0), nb=occ(60).find(o=>o.r.type!=='income'), cats=Object.entries(t.byCat).sort((a,b)=>b[1]-a[1]);
  const T=(cls,on,body)=>`<div class="bt ${cls}" onclick="${on}">${body}</div>`;
  let h=`<div class="pg"><div class="ey">Money</div><h2>Your picture</h2></div><div class="bento">`;
  h+=T('dark','A.cashCheck(true)',`<div class="k">Cash</div><div class="v">${c==null?'—':money(c)}</div><div class="s">${S.cash?'confirmed '+ago(S.cash.at):'tap to set'}</div>${fc?`<div style="margin-top:auto">${lineChart([{v:fc.v.slice(0,15),c:'#C6F36B',fill:1,w:2}],{h:40})}</div>`:''}`);
  h+=T('',"A.ptab('know')",`<div class="k">RAFIQ knows</div><div style="display:flex;align-items:center;gap:8px;margin-top:8px">${miniRing(ac.pc/100,ac.pc>=80?'var(--acc)':ac.pc>=50?'var(--warn)':'var(--bad)',ac.pc+'%')}<div class="s" style="margin:0">${ac.L.filter(x=>!x.ok).length?ac.L.filter(x=>!x.ok).length+' things to add':'All set'}</div></div><div class="s" style="margin-top:auto">Income, bills, spread costs ›</div>`);
  if(fc)h+=T('w',"openAcc.fc=1;A.ptab('know')",`<div class="sp"><div class="k">Next 30 days</div><div class="s" style="margin:0">lowest ${money(fc.low.v)}</div></div>${lineChart([{v:fc.v,c:'var(--acc)',fill:1}],{h:90,labels:[{i:0,t:'Today'},{i:15,t:'+15d'},{i:30,t:'+30d'}],pts:[{i:fc.low.i,v:fc.low.v,c:fc.low.v<0?'var(--bad)':'var(--warn)'}]})}`);
  h+=T('w',"A.tab('spend')",`<div class="sp"><div><div class="k">Spent in ${shortM(k)}</div><div class="v">${money(t.expense)}</div></div>${cats.length?`<div style="width:88px">${donut(cats.slice(0,5)).replace(/<div class="lg">[\s\S]*<\/div><\/div>$/,'</div>')}</div>`:''}</div><div class="s">${cats.slice(0,3).map(e=>esc(e[0])+' '+m0(e[1])).join(' · ')||'Nothing logged yet'}</div>`);
  if(S.spreads.length)h+=T('w',"A.tab('spend')",`<div class="k">Spread costs</div><div style="display:flex;gap:14px;margin-top:10px;overflow:hidden">${spreadInfo(0).slice(0,4).map(i=>`<div style="text-align:center;min-width:62px">${miniRing(i.x.amount?i.used/i.x.amount:0,i.over?'var(--bad)':i.ahead?'#F28C38':'#4C7BF4',Math.round(i.left))}<div class="s" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px">${esc(i.x.name)}</div></div>`).join('')}</div>`);
  h+=T('lime',"A.ptab('debts')",`<div class="k">Debt-free</div><div class="v" style="font-size:22px">${owe<=0?'Done 🎉':base.clear?shortM(base.end)+' '+base.end.slice(0,4):'—'}</div><div class="s">${owe>0?m0(owe)+' JOD to go':''}</div><div class="bar" style="margin-top:auto;background:rgba(15,21,19,.12)"><i style="width:${Math.max(3,pct(S.txns.filter(x=>x.type==='debt').reduce((a,x)=>a+x.amount,0),S.txns.filter(x=>x.type==='debt').reduce((a,x)=>a+x.amount,0)+owe))}%;background:#0F1513"></i></div>`);
  h+=T('',"A.ptab('know')",`<div class="k">Next bill</div>${nb?`<div class="v" style="font-size:20px">${money(nb.r.amount)}</div><div class="s">${esc(nb.r.name)} · ${nb.diff===0?'today':'in '+nb.diff+'d'}</div>`:'<div class="s" style="margin-top:8px">None in 60 days</div>'}`);
  h+=T('',"A.ptab('goals')",`<div class="k">Savings</div><div class="v" style="font-size:22px">${money(S.goals.reduce((a,g)=>a+goalSaved(g),0))}</div><div class="s">${S.goals.length?S.goals.length+' goal'+(S.goals.length>1?'s':''):'Set a goal ›'}</div>`);
  h+=T('',"A.importStatement()",`<div class="k">Bank statement</div><div style="margin-top:8px">${ibx('spend')}</div><div class="s" style="margin-top:auto">${(S.stmts||[]).length?'Last: '+esc(S.stmts[S.stmts.length-1])+' · add another':'Upload a PDF ›'}</div>`);
  h+=`</div>`;
  if(S.txns.length)h+=card(`<h3>Last 6 months</h3>${trendBars()}`,'')+'';
  return h;
};
V.know=()=>{
  const ac=accuracy(), c=cash(), cAge=S.cash?Math.floor((Date.now()-S.cash.at)/864e5):null, nx=occ(366);
  const rrow=r=>{ const n=nx.find(o=>o.r===r), gone=rfreq(r)==='once'&&r.done.includes('once'), k=r.type==='income'?'inc':r.type==='debt'?'debt':r.type==='saving'?'save':'bill';
    return `<div class="it" onclick="A.ruleForm('${r.id}')">${ibx(k)}<div class="tx"><div>${esc(r.name)}${!r.active?'<span class="tag">paused</span>':''}${gone?'<span class="tag">done</span>':''}</div><div class="sm mut">${ruleWhen(r)}${n&&r.active?' · next in '+n.diff+'d':''}</div></div><div class="am ${r.type==='income'?'pos':''}">${money(r.amount)}</div></div>`; };
  const sect=(k,title,status,tot,body,btn)=>card(`<div class="sect">${ibx(k)}<div style="flex:1;min-width:0"><h3>${title}</h3><div class="st">${status}</div></div>${tot!=null?`<div class="tot">${tot}</div>`:''}</div>${body}${btn?`<div class="row" style="margin-top:12px">${btn}</div>`:''}`);
  let h=`<div class="pg"><button class="btn sm" onclick="A.tab('home')">‹ Today</button><h2 style="margin-top:12px">What RAFIQ knows</h2></div>`;
  h+=card(`<div class="sp" style="align-items:center">${miniRing(ac.pc/100,ac.pc>=80?'var(--acc)':ac.pc>=50?'var(--warn)':'var(--bad)',ac.pc+'%')}<div style="flex:1;margin-left:4px"><b>${ac.pc>=80?'Up to date':ac.pc>=50?'Mostly up to date':'Needs a few details'}</b><div class="sm mut">RAFIQ works with just your cash and payday. Each tick below makes it sharper.</div></div></div><div class="row" style="margin-top:12px">${ac.L.map(x=>`<button class="chip ${x.ok?'ok':''}" ${x.ok?'':`onclick="${x.a}"`}>${x.ok?'✓':'+'} ${esc(x.t)}</button>`).join('')}</div>`);

  const inc=S.rules.filter(r=>r.type==='income'), incM=inc.filter(r=>r.active&&rfreq(r)==='monthly').reduce((a,r)=>a+r.amount,0);
  h+=sect('inc','Money in',inc.length?inc.length+' source'+(inc.length>1?'s':'')+' · per month':'<span class="sd r"></span>Add your salary',incM?money(incM):null,inc.map(rrow).join(''),`<button class="btn sm" onclick="A.ruleForm(null,'income')">+ Add income</button>`);

function scenHtml(){
  const g=id=>num(($('#'+id)||{}).value)||0, inc=g('sc1'), cutv=g('sc2'), lump=g('sc3'), com=g('sc4'), delta=inc+cutv-com;
  if(!inc&&!cutv&&!lump&&!com)return '<div class="sm mut">Enter any figure to see what it does to your plan.</div>';
  const rec=recommend(), b=sim(0), owe=S.debts.some(d=>debtBal(d)>0), L=[]; let tone='good', verdict='';
  if(delta<0){ const fr=rec.free!=null?rec.free+delta:null; tone=fr!=null&&fr<0?'bad':'warn'; verdict=tone==='bad'?'This does not fit your plan':'Affordable, but it slows you down';
    L.push(`Free cash falls by <b>${money(-delta)}</b> JOD a month${fr!=null?' to <b class="'+(fr<0?'neg':'')+'">'+money(fr)+'</b>':''}.`);
    if(rec.extra>0&&owe){ const w0=sim(rec.extra), w1=sim(Math.max(0,rec.extra+delta),-lump); if(w0.clear&&w1.clear&&w1.months>w0.months)L.push(`With less to put on debt, debt-free moves <b>${w1.months-w0.months} months later</b> (${monthLabel(w1.end)}).`); }
  }else{ const w=sim(delta,-lump);
    if(!owe){ verdict='More room every month'; L.push(`Free cash rises by <b>${money(delta)}</b> JOD a month.`); }
    else{ verdict=b.clear&&w.clear&&b.months>w.months?`Debt-free ${b.months-w.months} months sooner`:'No change to your debt-free date';
      L.push(`If it all goes to debt: debt-free <b>${w.clear?monthLabel(w.end):'not reached'}</b> instead of ${b.clear?monthLabel(b.end):'never'}.`);
      if(b.interest-w.interest>1)L.push(`Interest saved: <b class="pos">${money(b.interest-w.interest)}</b> JOD.`);
      if(delta>0)L.push(`Or keep it: about <b>${money(delta/30)}</b> JOD more per day to spend.`); } }
  return `<div class="mv ${tone}"><div class="t">${verdict}</div>${L.map(l=>`<div class="sm" style="margin-top:3px">${l}</div>`).join('')}${delta>=10&&owe?`<div class="row" style="margin-top:8px"><button class="btn sm pri" onclick="A.commitExtra(${Math.floor(delta/10)*10})">Commit ${m0(Math.floor(delta/10)*10)} a month to debt</button></div>`:''}</div>`;
}
